name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile application and tests
        run: |
          mkdir -p build/classes
          javac -d build/classes src/easykanban/*.java
          javac -cp lib/junit-platform-console-standalone-1.6.0.jar:build/classes -d build/classes test/easykanban/*.java

      - name: Run tests
        run: java -jar lib/junit-platform-console-standalone-1.6.0.jar --class-path build/classes --scan-class-path
